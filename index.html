<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>To-do list</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="To-do list">
    <meta name="keywords" content="lista, to-do, tarefas">
    <meta name="description" content="Organize sua rotina e suas tarefas com nosso site de lista de a fazeres (to-do list)">
    <meta name="author" content="Gabriel Vitório dos Santos">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <link rel="shortcut icon" href="./img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main class="container">
    <article class="todo-app">
      <h2>To-do list <img src="./img/icon.png" alt="Site icon"/></h2>
      <div class="row">
        <input type="text" id="input-box" placeholder="Adione seu texto" title="Campo para adicionar a tarefa" autofocus/>
        <button id="button--addTask">Adicionar</button>
      </div>
      <div id="div--mensagemParaInputVazio" class="scale0">
        <p>Você precisa escrever algo para adicionar uma tarefa!</p>
      </div>
      <ul id="list-container">
      </ul>
    </article>
  </main>
  <script src="./js/main.js"></script>
</body>
</html>
